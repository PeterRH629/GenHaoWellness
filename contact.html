<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &amp; Location &mdash; GenHao Wellness</title>
<meta name="description" content="Address, hours, phone and email for GenHao Wellness at ActivSpace, West Seattle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261102b">
</head>
<body>
<div id="app"></div>

<script src="common.js?v=20261102b"></script>
<script>
mountPage('contact', function (T) {
  const hoursRowsHtml = HOURS_RAW.map(h => `
    <div style="display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:15px;">
      <span style="color:var(--ink-soft);">${esc(T.location.days[h.key])}</span>
      <span style="font-weight:600;">${h.hours === 'MSG' ? esc(T.location.messageLabel) : (h.hours ? esc(h.hours) : esc(T.location.closedLabel))}</span>
    </div>
  `).join('');

  return `
  <section class="section-pad" style="padding-top:88px; padding-bottom:88px;">
    <div class="wrap">
      <h1 style="font-size:32px; font-weight:700; text-align:center; margin-bottom:44px;">${esc(T.location.heading)}</h1>
      <div class="location-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:stretch;">
        <div class="card" style="display:flex; flex-direction:column; gap:22px;">
          <div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ACCENT_HEX}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.4"></circle></svg>
              <span style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">${esc(T.location.addressLabel)}</span>
            </div>
            <p style="font-size:16px; line-height:1.6;">3400 Harbor Ave SW<br>Seattle, WA 98126</p>
            <p style="font-size:13.5px; color:var(--ink-soft); margin-top:6px;">${esc(T.location.neighborhood)}</p>
          </div>
          <div style="border-top:1px solid var(--line); padding-top:20px;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ACCENT_HEX}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c0-.6.4-1 1-1h3.2c.5 0 .9.3 1 .8l1 3.6c.1.4 0 .9-.4 1.2L7.6 11c1.1 2.4 3 4.3 5.4 5.4l1.4-2.2c.3-.4.8-.5 1.2-.4l3.6 1c.5.1.8.5.8 1V19c0 .6-.4 1-1 1h-1C9.6 20 4 14.4 4 7V5Z"></path></svg>
              <span style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">${esc(T.location.phoneLabel)}</span>
            </div>
            <a href="tel:+19183830629" style="font-size:16px; color:var(--ink);">(918) 383-0629</a>
          </div>
          <div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ACCENT_HEX}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
              <span style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">${esc(T.location.emailLabel)}</span>
            </div>
            <a href="mailto:genhaowellness@gmail.com" style="font-size:16px; color:var(--ink); word-break:break-word;">genhaowellness@gmail.com</a>
          </div>
        </div>
        <div class="card">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ACCENT_HEX}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 2"></path></svg>
            <span style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">${esc(T.location.hoursLabel)}</span>
          </div>
          <div style="display:flex; flex-direction:column;">${hoursRowsHtml}</div>
        </div>
      </div>
    </div>
  </section>
  `;
});
</script>
<script data-goatcounter="https://genhaowellness.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
