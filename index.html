<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenHao Wellness &mdash; Personal Training &amp; Wellness Coaching, West Seattle</title>
<meta name="description" content="GenHao Wellness is a kinesiology-based personal training studio in West Seattle, WA, specializing in post-injury recovery and body composition coaching.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261102">
</head>
<body>
<div id="app"></div>

<script src="common.js?v=20261102"></script>
<script>
mountPage('about', function (T) {
  return `
  <section id="top" style="padding-top:88px; padding-bottom:80px;">
    <div class="wrap hero-grid" style="display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center;">
      <div>
        <span class="eyebrow">${esc(T.hero.eyebrow)}</span>
        <h1 class="hero-headline" style="font-size:58px; line-height:1.06; font-weight:700; letter-spacing:-0.02em; white-space:pre-line;">${esc(T.hero.headline)}</h1>
        <p style="margin-top:24px; font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:480px;">${esc(T.hero.sub)}</p>
        <div style="margin-top:36px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
          <a class="btn btn-accent" href="${BOOK_URL}" target="_blank" rel="noopener">${esc(T.hero.cta)}</a>
          <span style="font-size:14px; color:var(--ink-soft);">${esc(T.hero.note)}</span>
        </div>
      </div>
      <div class="hero-visual" style="position:relative; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #D5E5DA 0%, var(--bg-alt) 70%);"></div>
        <div style="position:absolute; width:340px; height:340px; border-radius:50%; border:1px solid var(--line);"></div>
        <div style="position:relative;">
          <img src="${LOGO_SRC}" alt="GenHao Wellness logo" style="width:230px; height:auto; display:block; filter:drop-shadow(0 18px 30px rgba(38,25,15,0.18));">
        </div>
      </div>
    </div>
  </section>

  <section id="about" class="section-pad" style="padding-top:72px; padding-bottom:72px; background:var(--bg-alt); border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
    <div class="wrap" style="max-width:720px; text-align:center; margin:0 auto;">
      <span class="eyebrow">${esc(T.about.eyebrow)}</span>
      <h2 style="font-size:34px; font-weight:700; letter-spacing:-0.01em; line-height:1.2;">${esc(T.about.heading)}</h2>
      <p class="about-body" style="margin-top:20px; font-size:18px; line-height:1.7; color:var(--ink-soft);">${esc(T.about.body)}</p>
    </div>
  </section>
  `;
});
</script>
</body>
</html>
