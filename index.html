<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenHao Wellness &mdash; Personal Training &amp; Wellness Coaching, West Seattle</title>
<meta name="description" content="GenHao Wellness is a kinesiology-based personal training studio in West Seattle, WA, specializing in post-injury recovery and body composition coaching.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F2;
    --bg-alt: #F3EAE0;
    --ink: #26190F;
    --ink-soft: #6b5c4c;
    --accent: #C96A3B;
    --accent-dark: #A6522A;
    --line: #E6D9C8;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Work Sans', system-ui, -apple-system, sans-serif; }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; margin: 0; }
  p { margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-dark); }
  img { max-width: 100%; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 48px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 28px; border-radius: 999px; font-weight: 600; font-size: 15px;
    white-space: nowrap; cursor: pointer; border: 1px solid transparent;
  }
  .btn-accent { background: var(--accent); color: var(--white); }
  .btn-accent:hover { background: var(--accent-dark); color: var(--white); }
  .btn-outline { background: transparent; color: var(--white); border-color: rgba(255,255,255,0.4); }
  .btn-outline:hover { border-color: #fff; color: #fff; }
  .eyebrow {
    display: inline-block; font-size: 12.5px; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
  }
  .lang-switch { display: flex; gap: 4px; background: var(--bg-alt); border-radius: 999px; padding: 4px; }
  .lang-btn {
    border: none; background: transparent; font-family: 'Work Sans', sans-serif; font-size: 13px;
    font-weight: 600; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--ink-soft);
  }
  .lang-btn.active { background: var(--ink); color: var(--white); }
  table { border-collapse: collapse; width: 100%; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 36px; }
  .table-wrap { background: var(--white); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 40px; }
  th { text-align: right; padding: 14px 20px; color: var(--white); font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  th:first-child { text-align: left; }
  td { padding: 16px 20px; text-align: right; border-top: 1px solid var(--line); }
  td:first-child { text-align: left; font-weight: 600; font-size: 15px; }
  .price-total { font-weight: 600; font-size: 15px; }
  .price-per { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  @media (max-width: 760px) {
    .wrap { padding: 0 22px; }
    .hero-grid { grid-template-columns: 1fr !important; }
    .hero-visual { display: none !important; }
    .about-body { font-size: 17px !important; }
    .services-grid { grid-template-columns: 1fr !important; }
    .location-grid { grid-template-columns: 1fr !important; }
    .single-grid { grid-template-columns: 1fr !important; }
    .nav-links { display: none !important; }
    .hero-headline { font-size: 40px !important; }
    .section-pad { padding-top: 56px !important; padding-bottom: 56px !important; }
    .table-wrap { overflow-x: auto; }
    .table-wrap table { min-width: 560px; }
  }
</style>
</head>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ACCENT_HEX}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 2"></path></svg>
            <span style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">${esc(T.location.hoursLabel)}</span>
          </div>
          <div style="display:flex; flex-direction:column;">${hoursRowsHtml}</div>
        </div>
      </div>
    </div>
  </section>

  <section style="padding:84px 0; background:var(--ink); text-align:center;">
    <div class="wrap">
      <h2 style="color:var(--white); font-size:32px; font-weight:700;">${esc(T.cta.heading)}</h2>
      <p style="color:rgba(255,255,255,0.65); font-size:16px; margin-top:14px;">${esc(T.cta.sub)}</p>
      <div style="margin-top:30px; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;">
        <a class="btn btn-accent" href="${BOOK_URL}" target="_blank" rel="noopener">${esc(T.cta.button)}</a>
        <a class="btn btn-outline" href="tel:+14258663332">(425) 866-3332</a>
      </div>
    </div>
  </section>

  <footer style="padding:26px 0; background:var(--bg);">
    <div class="wrap" style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
      <span style="font-size:13px; color:var(--ink-soft);">${esc(T.footer.rights)}</span>
      <span style="font-size:13px; color:var(--ink-soft);">3400 Harbor Ave SW, Seattle, WA 98126</span>
    </div>
  </footer>
  `;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.getAttribute('data-lang');
      document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : currentLang;
      render();
    });
  });
}

render();
</script>
</body>
